<!-- @dsCard group="Colors" viewport="700x130" name="Neutros cálidos" subtitle="Tonos papel y escala ink — nunca grises puros" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:18px;}
  .row{display:flex;gap:8px;}
  .sw{flex:1;text-align:center;}
  .chip{height:60px;border-radius:10px;border:1px solid rgba(34,34,34,.08);}
  .lab{font-size:11px;font-weight:700;color:var(--fg-muted);margin-top:6px;}
  .hex{font-size:10px;color:var(--fg-subtle);font-weight:600;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#fbf9f4"></div><div class="lab">paper</div><div class="hex">#FBF9F4</div></div>
    <div class="sw"><div class="chip" style="background:#f4efe6"></div><div class="lab">paper-2</div><div class="hex">#F4EFE6</div></div>
    <div class="sw"><div class="chip" style="background:#ece5d8"></div><div class="lab">paper-3</div><div class="hex">#ECE5D8</div></div>
    <div class="sw"><div class="chip" style="background:#e7dcc8"></div><div class="lab">sand</div><div class="hex">#E7DCC8</div></div>
    <div class="sw"><div class="chip" style="background:#9b968c"></div><div class="lab">ink-400</div><div class="hex">#9B968C</div></div>
    <div class="sw"><div class="chip" style="background:#76726a"></div><div class="lab">ink-500</div><div class="hex">#76726A</div></div>
    <div class="sw"><div class="chip" style="background:#222"></div><div class="lab">ink-900</div><div class="hex">#222222</div></div>
  </div>
</body></html>
