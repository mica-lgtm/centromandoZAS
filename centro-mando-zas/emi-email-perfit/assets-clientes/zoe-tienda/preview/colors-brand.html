<!-- @dsCard group="Colors" viewport="700x150" name="Brand palette" subtitle="Ink · verde · blanco — los tres colores de marca" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:18px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);}
  .chip{height:78px;display:flex;align-items:flex-end;padding:10px 12px;}
  .meta{padding:8px 12px 10px;background:#fff;}
  .name{font-weight:700;font-size:15px;color:var(--fg);}
  .hex{font-size:13px;color:var(--fg-subtle);font-weight:600;letter-spacing:.02em;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#222222"></div><div class="meta"><div class="name">Ink</div><div class="hex">#222222</div></div></div>
    <div class="sw"><div class="chip" style="background:#78ac5e"></div><div class="meta"><div class="name">Verde Zoe</div><div class="hex">#78AC5E</div></div></div>
    <div class="sw"><div class="chip" style="background:#fff"></div><div class="meta"><div class="name">Blanco</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body></html>
