<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--paper);padding:20px 24px;}
.over{margin-bottom:16px;}
.weights{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;}
.w{font-size:34px;color:var(--fg);}
.wl{display:block;font-size:10px;font-weight:600;color:var(--fg-subtle);letter-spacing:.04em;text-align:center;margin-top:2px;}</style></head>
<body>
  <div class="over"><span class="zoe-overline">Novedad</span> &nbsp; <span class="zoe-overline" style="color:var(--accent-terracotta)">Oferta</span> &nbsp; <span class="zoe-overline" style="color:var(--fg-muted)">Envío gratis</span></div>
  <div class="weights">
    <div><span class="w" style="font-weight:300">Aa</span><span class="wl">Light 300</span></div>
    <div><span class="w" style="font-weight:400">Aa</span><span class="wl">Regular 400</span></div>
    <div><span class="w" style="font-weight:500">Aa</span><span class="wl">Medium 500</span></div>
    <div><span class="w" style="font-weight:600">Aa</span><span class="wl">SemiBold 600</span></div>
    <div><span class="w" style="font-weight:700">Aa</span><span class="wl">Bold 700</span></div>
    <div><span class="w" style="font-weight:800">Aa</span><span class="wl">ExtraBold 800</span></div>
  </div>
</body></html>
