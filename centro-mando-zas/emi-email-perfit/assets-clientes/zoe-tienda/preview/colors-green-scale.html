<!-- @dsCard group="Colors" viewport="700x130" name="Escala verde" subtitle="Tints y estados derivados del verde de marca" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:18px;}
  .row{display:flex;gap:6px;}
  .sw{flex:1;text-align:center;}
  .chip{height:62px;border-radius:10px;border:1px solid rgba(34,34,34,.06);}
  .lab{font-size:11px;font-weight:700;color:var(--fg-muted);margin-top:6px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#f4f8f0"></div><div class="lab">50</div></div>
    <div class="sw"><div class="chip" style="background:#eaf2e3"></div><div class="lab">100</div></div>
    <div class="sw"><div class="chip" style="background:#d6e7cc"></div><div class="lab">200</div></div>
    <div class="sw"><div class="chip" style="background:#b4d3a4"></div><div class="lab">300</div></div>
    <div class="sw"><div class="chip" style="background:#93bf7e"></div><div class="lab">400</div></div>
    <div class="sw"><div class="chip" style="background:#78ac5e;outline:2px solid #222;outline-offset:2px"></div><div class="lab">500</div></div>
    <div class="sw"><div class="chip" style="background:#66954f"></div><div class="lab">600</div></div>
    <div class="sw"><div class="chip" style="background:#547a40"></div><div class="lab">700</div></div>
    <div class="sw"><div class="chip" style="background:#3f5d30"></div><div class="lab">900</div></div>
  </div>
</body></html>
