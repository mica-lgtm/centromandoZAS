<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--paper);padding:20px 24px;display:flex;gap:16px;align-items:flex-end;}
.col{text-align:center;}
.box{width:74px;height:60px;background:var(--green-100);border:2px solid var(--zoe-green);}
.l{font-size:11px;font-weight:700;color:var(--fg-muted);margin-top:8px;}</style></head>
<body>
  <div class="col"><div class="box" style="border-radius:6px"></div><div class="l">xs · 6</div></div>
  <div class="col"><div class="box" style="border-radius:10px"></div><div class="l">sm · 10</div></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><div class="l">md · 16</div></div>
  <div class="col"><div class="box" style="border-radius:24px"></div><div class="l">lg · 24</div></div>
  <div class="col"><div class="box" style="border-radius:32px"></div><div class="l">xl · 32</div></div>
  <div class="col"><div class="box" style="border-radius:999px"></div><div class="l">pill</div></div>
</body></html>
