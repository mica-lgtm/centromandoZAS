<!-- @dsCard group="Colors" viewport="700x150" name="Color en uso" subtitle="Bloques suaves para promos, CTAs y acento de oferta" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--paper);padding:18px;display:flex;gap:14px;}
  .block{flex:1;border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;justify-content:center;min-height:96px;}
  .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
  .v{font-size:21px;font-weight:800;margin-top:4px;}
</style></head>
<body>
  <div class="block" style="background:var(--green-100);color:var(--green-700)"><div class="k">Promo suave</div><div class="v">verde 100</div></div>
  <div class="block" style="background:var(--zoe-green);color:#fff"><div class="k">CTA / acción</div><div class="v">verde 500</div></div>
  <div class="block" style="background:var(--accent-terracotta);color:#fff"><div class="k">Oferta</div><div class="v">terracota</div></div>
  <div class="block" style="background:var(--zoe-ink);color:#fff"><div class="k">Alto contraste</div><div class="v">ink</div></div>
</body></html>
