<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--paper);padding:26px 24px;display:flex;gap:20px;align-items:center;justify-content:space-between;}
.col{text-align:center;}
.box{width:96px;height:64px;background:#fff;border-radius:16px;}
.l{font-size:11px;font-weight:700;color:var(--fg-muted);margin-top:12px;}</style></head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="l">xs</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="l">sm</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="l">md</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="l">lg</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-brand);background:var(--zoe-green)"></div><div class="l">brand</div></div>
</body></html>
