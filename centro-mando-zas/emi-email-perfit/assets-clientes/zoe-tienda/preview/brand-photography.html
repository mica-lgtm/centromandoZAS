<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-body); }
  .row { display: flex; gap: 10px; padding: 16px; }
  .row img {
    width: 130px; height: 148px; object-fit: cover; border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm); display: block;
  }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--green-700); padding: 0 16px; margin: 2px 0 -6px; }
</style>
</head>
<body>
  <div class="row">
    <img src="../assets/products/lifestyle-bench.jpg" alt="">
    <img src="../assets/products/ttl-flatlay.jpg" alt="">
    <img src="../assets/products/pack-242box-fan.jpg" alt="">
    <img src="../assets/products/toda-autoridad.jpg" alt="">
    <img src="../assets/products/de-regreso-evangelio.jpg" alt="">
  </div>
</body>
</html>
