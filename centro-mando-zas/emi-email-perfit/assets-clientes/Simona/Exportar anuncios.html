<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMONA · Exportar anuncios</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0; background:var(--simona-stone); font-family:var(--font-text); color:var(--simona-ink);}
  .wrap{max-width:820px; margin:0 auto; padding:48px 24px 80px;}
  .kicker{font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; opacity:.62;}
  h1{font-family:var(--font-display); font-weight:900; font-size:34px; letter-spacing:-0.02em; margin:8px 0 6px;}
  .lede{opacity:.74; font-size:15px; line-height:1.5; max-width:600px;}
  .btn{margin-top:24px; display:inline-flex; align-items:center; gap:12px; border:0; cursor:pointer; background:var(--simona-ink); color:var(--simona-cream); font-family:var(--font-text); font-weight:700; font-size:16px; letter-spacing:.03em; padding:18px 34px; border-radius:999px;}
  .btn:disabled{opacity:.5; cursor:default;}
  .status{margin-top:16px; font-size:14px; opacity:.7; min-height:20px;}
  .grid{margin-top:40px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .cell{background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 8px 24px rgba(42,42,42,.14);}
  .cell .holder{position:relative; background:#f0e8e0;}
  .cell .scaled{transform-origin:top left;}
  .cell .lbl{padding:10px 12px; font-size:11.5px;}
  .cell .lbl b{font-family:var(--font-display); font-weight:800; font-size:13px; display:block;}
  .cell .lbl span{opacity:.6;}
  /* offscreen native-size render target */
  #stage{position:fixed; left:-99999px; top:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Campaña Sweaters · Finde largo</div>
  <h1>Exportar anuncios</h1>
  <div class="lede">9 placas a tamaño real listas para subir: 3 versiones × 3 formatos (Cuadrado 1080×1080, Vertical 1080×1920, Horizontal 1200×628). Descargá todo en un ZIP con PNG nativos.</div>
  <button class="btn" id="dl">Descargar PNGs (ZIP)</button>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="stage"></div>

<script type="text/babel" src="ads3/AdKit.jsx"></script>
<script type="text/babel" src="ads3/V1Editorial.jsx"></script>
<script type="text/babel" src="ads3/V2Bold.jsx"></script>
<script type="text/babel" src="ads3/V3Typographic.jsx"></script>
<script type="text/babel">
  const COMPS = { v1: V1Editorial, v2: V2Bold, v3: V3Typographic };
  const VNAME = { v1: 'editorial', v2: 'bold', v3: 'tipografica' };
  const FMTNAME = { sq: 'cuadrado-1080x1080', vt: 'vertical-1080x1920', hz: 'horizontal-1200x628' };
  const ITEMS = [];
  ['v1','v2','v3'].forEach(v => ['sq','vt','hz'].forEach(fmt => ITEMS.push({ v, fmt })));

  const stageRoot = ReactDOM.createRoot(document.getElementById('stage'));

  // render a single placard at native size offscreen, return the DOM node once painted
  function renderNative(v, fmt) {
    const C = COMPS[v];
    return new Promise(resolve => {
      stageRoot.render(<div id="shot"><C fmt={fmt} /></div>);
      // setTimeout (not rAF — rAF is paused when the tab/iframe is backgrounded)
      setTimeout(() => resolve(document.getElementById('shot')), 450);
    });
  }

  async function toPng(v, fmt) {
    const f = FORMATS[fmt];
    const node = await renderNative(v, fmt);
    // ensure all imgs/bg loaded
    return await htmlToImage.toPng(node, { width: f.w, height: f.h, pixelRatio: 1 });
  }

  // thumbnail gallery (scaled previews)
  function Thumbs() {
    return ITEMS.map(({ v, fmt }) => {
      const f = FORMATS[fmt];
      const s = Math.min(150 / f.w, 200 / f.h);
      const C = COMPS[v];
      return (
        <div className="cell" key={v + fmt}>
          <div className="holder" style={{ width: f.w * s, height: f.h * s, margin: '0 auto' }}>
            <div className="scaled" style={{ width: f.w, height: f.h, transform: `scale(${s})` }}>
              <C fmt={fmt} />
            </div>
          </div>
          <div className="lbl"><b>{VNAME[v]}</b><span>{FMTNAME[fmt]}</span></div>
        </div>
      );
    });
  }
  ReactDOM.createRoot(document.getElementById('grid')).render(<Thumbs />);

  const statusEl = document.getElementById('status');
  const btn = document.getElementById('dl');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const zip = new JSZip();
    try {
      for (let i = 0; i < ITEMS.length; i++) {
        const { v, fmt } = ITEMS[i];
        statusEl.textContent = `Generando ${i + 1}/9 · ${VNAME[v]} ${FMTNAME[fmt]}…`;
        const dataUrl = await toPng(v, fmt);
        const b64 = dataUrl.split(',')[1];
        zip.file(`simona-sweaters-${VNAME[v]}-${FMTNAME[fmt]}.png`, b64, { base64: true });
      }
      statusEl.textContent = 'Comprimiendo ZIP…';
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'SIMONA-anuncios-sweaters.zip';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      statusEl.textContent = '✓ Listo. Se descargaron las 9 placas en PNG.';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
