<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Base-4 · 4 → 96px" viewport="700x260" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 24px 30px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:14px; }
  .bar { height:14px; background: var(--simona-blush); border-radius:3px; }
  .lbl { font-size:11.5px; color:var(--fg2); width:96px; flex:none; }
  .lbl b { color: var(--fg1); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="lbl"><b>sp-1</b> · 4px</div><div class="bar" style="width:4px"></div></div>
    <div class="row"><div class="lbl"><b>sp-2</b> · 8px</div><div class="bar" style="width:8px"></div></div>
    <div class="row"><div class="lbl"><b>sp-3</b> · 12px</div><div class="bar" style="width:12px"></div></div>
    <div class="row"><div class="lbl"><b>sp-4</b> · 16px</div><div class="bar" style="width:16px"></div></div>
    <div class="row"><div class="lbl"><b>sp-5</b> · 24px</div><div class="bar" style="width:24px"></div></div>
    <div class="row"><div class="lbl"><b>sp-6</b> · 32px</div><div class="bar" style="width:32px"></div></div>
    <div class="row"><div class="lbl"><b>sp-7</b> · 48px</div><div class="bar" style="width:48px"></div></div>
    <div class="row"><div class="lbl"><b>sp-8</b> · 64px</div><div class="bar" style="width:64px"></div></div>
    <div class="row"><div class="lbl"><b>sp-9</b> · 96px</div><div class="bar" style="width:96px"></div></div>
  </div>
</body>
</html>
