<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display type" subtitle="Hero / hook · Display Black 900" viewport="700x170" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); }
  .wrap { padding: 24px 30px; }
  .eyebrow { font-family: var(--font-text); font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2); }
  .display { font-family: var(--font-display); font-weight:900; font-size:72px; line-height:.96; letter-spacing:-0.02em; color:var(--fg1); margin:8px 0 6px; }
  .display em { font-style: italic; color: var(--accent-deep); }
  .note { font-family: var(--font-text); font-size:12px; color:var(--fg3); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">NUEVA TEMPORADA</div>
    <div class="display">Abrigos que <em>abrazan</em></div>
    <div class="note">Display · Red Hat Display Black 900 · line-height .96 · tracking −0.02em</div>
  </div>
</body>
</html>
