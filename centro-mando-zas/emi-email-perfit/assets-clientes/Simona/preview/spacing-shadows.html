<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Soft warm elevation" viewport="700x175" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 30px; display:flex; gap:30px; }
  .item { text-align:center; }
  .box { background: var(--simona-white); width:150px; height:78px; border-radius: var(--r-lg); }
  .sm { box-shadow: var(--shadow-sm); }
  .md { box-shadow: var(--shadow-md); }
  .lg { box-shadow: var(--shadow-lg); }
  .name { font-weight:700; font-size:12px; color:var(--fg1); margin-top:14px; }
  .val { font-size:10.5px; color:var(--fg3); margin-top:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box sm"></div><div class="name">shadow-sm</div><div class="val">tinte ink · sutil</div></div>
    <div class="item"><div class="box md"></div><div class="name">shadow-md</div><div class="val">tinte taupe · cards</div></div>
    <div class="item"><div class="box lg"></div><div class="name">shadow-lg</div><div class="val">tinte taupe · elevado</div></div>
  </div>
</body>
</html>
