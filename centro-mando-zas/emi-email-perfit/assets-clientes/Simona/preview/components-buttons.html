<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, blush + states" viewport="700x200" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 26px 30px; display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .btn { font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; border-radius:var(--r-pill); padding:13px 26px; border:0; cursor:default; display:inline-flex; align-items:center; gap:9px; }
  .primary { background:var(--btn-bg); color:var(--btn-fg); }
  .primary.hover { background:var(--btn-bg-hover); }
  .primary.press { background:var(--btn-bg-hover); transform:scale(.97); }
  .secondary { background:transparent; color:var(--fg1); border:1.5px solid var(--line-strong); }
  .blush { background:var(--accent); color:var(--simona-ink); }
  .lbl { font-size:11px; color:var(--fg3); width:62px; flex:none; }
  .arrow { font-size:15px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="lbl">Default</span><button class="btn primary">Ver colección <span class="arrow">→</span></button><button class="btn secondary">Seguir comprando</button><button class="btn blush">Comprar ahora</button></div>
    <div class="row"><span class="lbl">Hover</span><button class="btn primary hover">Ver colección <span class="arrow">→</span></button><span style="font-size:12px;color:var(--fg3)">fondo aclara a #3A3836</span></div>
    <div class="row"><span class="lbl">Press</span><button class="btn primary press">Ver colección <span class="arrow">→</span></button><span style="font-size:12px;color:var(--fg3)">scale 0.97</span></div>
  </div>
</body>
</html>
