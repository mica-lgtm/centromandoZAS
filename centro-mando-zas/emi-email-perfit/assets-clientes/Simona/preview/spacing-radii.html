<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm → xl + pill" viewport="700x150" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 24px 30px; display:flex; gap:18px; align-items:flex-end; }
  .item { text-align:center; }
  .box { background: var(--simona-clay); border:1px solid var(--line-strong); width:84px; height:64px; }
  .r-sm{border-radius:8px}.r-md{border-radius:14px}.r-lg{border-radius:22px}.r-xl{border-radius:32px}.r-pill{border-radius:999px}
  .name { font-weight:700; font-size:12px; color:var(--fg1); margin-top:9px; }
  .val { font-size:11px; color:var(--fg3); margin-top:1px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box r-sm"></div><div class="name">sm</div><div class="val">8px</div></div>
    <div class="item"><div class="box r-md"></div><div class="name">md</div><div class="val">14px</div></div>
    <div class="item"><div class="box r-lg"></div><div class="name">lg</div><div class="val">22px</div></div>
    <div class="item"><div class="box r-xl"></div><div class="name">xl</div><div class="val">32px</div></div>
    <div class="item"><div class="box r-pill"></div><div class="name">pill</div><div class="val">999px</div></div>
  </div>
</body>
</html>
