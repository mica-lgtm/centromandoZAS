<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type roles" subtitle="Eyebrow, CTA, comercial, hook" viewport="700x200" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); }
  .wrap { padding: 22px 30px; display:grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
  .item { }
  .k { font-family:var(--font-text); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--fg3); margin-bottom:7px; }
  .eyebrow { font-family:var(--font-text); font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2); }
  .cta { display:inline-block; font-family:var(--font-text); font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--btn-fg); background:var(--btn-bg); padding:11px 22px; border-radius:var(--r-pill); }
  .comm { font-family:var(--font-text); font-weight:700; font-size:15px; color:var(--fg1); }
  .comm span { color: var(--fg3); font-weight:500; }
  .quote { font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-0.01em; color:var(--fg1); line-height:1.15; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="k">Eyebrow / label</div><div class="eyebrow">OTOÑO 25 · NUEVO</div></div>
    <div class="item"><div class="k">CTA</div><div class="cta">Ver colección</div></div>
    <div class="item"><div class="k">Info comercial</div><div class="comm">3 cuotas sin interés <span>· envío gratis</span></div></div>
    <div class="item"><div class="k">Hook / título corto</div><div class="quote">Listo para el frío de verdad</div></div>
  </div>
</body>
</html>
