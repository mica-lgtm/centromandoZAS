<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Photography" subtitle="Street-style cálido, producto fiel" viewport="700x270" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 22px 26px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .ph { aspect-ratio:4/5; border-radius:var(--r-md); background-size:cover; background-position:center top; }
  .cap { font-size:11px; color:var(--fg3); margin-top:12px; letter-spacing:.02em; }
  .cap b { color:var(--fg2); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="ph" style="background-image:url('../assets/simona-look-01.webp')"></div>
      <div class="ph" style="background-image:url('../assets/simona-look-03.webp')"></div>
      <div class="ph" style="background-image:url('../assets/simona-look-05.webp')"></div>
      <div class="ph" style="background-image:url('../assets/simona-look-06.webp')"></div>
    </div>
    <div class="cap"><b>Street-style Buenos Aires</b> · luz natural · paleta cálida ligeramente desaturada · tonos tierra · producto fiel al original, sin deformar ni recolorar.</div>
  </div>
</body>
</html>
