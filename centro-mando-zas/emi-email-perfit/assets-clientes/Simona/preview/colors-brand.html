<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand palette" subtitle="Taupe, blush, ink, white" viewport="700x180" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 26px 28px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 92px; }
  .meta { padding: 10px 12px 12px; background: var(--simona-white); }
  .name { font-weight: 700; font-size: 14px; color: var(--fg1); letter-spacing: -0.01em; }
  .hex { font-size: 12px; color: var(--fg3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .role { font-size: 11px; color: var(--fg2); margin-top: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:#70625f"></div><div class="meta"><div class="name">Taupe</div><div class="hex">#70625F</div><div class="role">Color firma · texto 2°</div></div></div>
      <div class="sw"><div class="chip" style="background:#fbbfaf"></div><div class="meta"><div class="name">Blush</div><div class="hex">#FBBFAF</div><div class="role">Acento · detalles</div></div></div>
      <div class="sw"><div class="chip" style="background:#2a2a2a"></div><div class="meta"><div class="name">Ink</div><div class="hex">#2A2A2A</div><div class="role">Negro suave · texto</div></div></div>
      <div class="sw" style="border:1px solid var(--line)"><div class="chip" style="background:#ffffff"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div><div class="role">Fondos limpios</div></div></div>
    </div>
  </div>
</body>
</html>
