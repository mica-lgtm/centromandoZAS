<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic text" subtitle="fg roles on light & dark" viewport="700x170" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { border-radius: var(--r-md); padding: 18px 20px; }
  .light { background: var(--simona-white); border: 1px solid var(--line); }
  .dark { background: var(--simona-ink); }
  .t1 { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .t2 { font-weight: 500; font-size: 14px; margin-top: 6px; }
  .t3 { font-size: 12px; margin-top: 4px; }
  .ac { font-weight: 700; font-size: 12px; margin-top: 10px; }
  .light .t1 { color: var(--fg1); } .light .t2 { color: var(--fg2); } .light .t3 { color: var(--fg3); } .light .ac { color: var(--accent-deep); }
  .dark .t1 { color: var(--fg-on-dark); } .dark .t2 { color: var(--fg-on-dark-2); } .dark .t3 { color: var(--fg-on-dark-2); } .dark .ac { color: var(--accent); }
  .tag { display:inline-block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--fg3); margin-bottom:10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light">
      <div class="tag">Sobre claro</div>
      <div class="t1">fg1 · texto principal</div>
      <div class="t2">fg2 · texto secundario en taupe</div>
      <div class="t3">fg3 · metadatos y captions</div>
      <div class="ac">accent · blush para detalle</div>
    </div>
    <div class="panel dark">
      <div class="tag" style="color:#b9ada6">Sobre oscuro</div>
      <div class="t1">fg sobre ink</div>
      <div class="t2">texto secundario claro</div>
      <div class="t3">metadatos sobre oscuro</div>
      <div class="ac">accent blush</div>
    </div>
  </div>
</body>
</html>
