<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Warm neutrals" subtitle="Cream → mocha + blush soft" viewport="700x130" -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-text); }
  .wrap { padding: 26px 28px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); }
  .chip { height: 64px; }
  .meta { padding: 8px 9px 10px; background: var(--simona-white); }
  .name { font-weight: 700; font-size: 12px; color: var(--fg1); }
  .hex { font-size: 10px; color: var(--fg3); margin-top: 2px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw"><div class="chip" style="background:#f7f1ea"></div><div class="meta"><div class="name">Cream</div><div class="hex">#F7F1EA</div></div></div>
      <div class="sw"><div class="chip" style="background:#efe6dc"></div><div class="meta"><div class="name">Sand</div><div class="hex">#EFE6DC</div></div></div>
      <div class="sw"><div class="chip" style="background:#e4d6ca"></div><div class="meta"><div class="name">Clay</div><div class="hex">#E4D6CA</div></div></div>
      <div class="sw"><div class="chip" style="background:#c9bab0"></div><div class="meta"><div class="name">Stone</div><div class="hex">#C9BAB0</div></div></div>
      <div class="sw"><div class="chip" style="background:#9a877f"></div><div class="meta"><div class="name">Mocha</div><div class="hex">#9A877F</div></div></div>
      <div class="sw"><div class="chip" style="background:#fdded5"></div><div class="meta"><div class="name">Blush soft</div><div class="hex">#FDDED5</div></div></div>
    </div>
  </div>
</body>
</html>
