<!-- @dsCard group="Spacing" viewport="700x150" name="Radios de esquina" subtitle="De 6px a totalmente redondeado (pill)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); padding: 20px 24px; }
  .row { display: flex; gap: 18px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 82px; height: 60px; background: var(--violeta-100); border: 2px solid var(--violeta-500); }
  .n { font-size: 11px; font-weight: 700; color: var(--violeta-900); }
  .px { font-size: 10px; color: var(--gris-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><span class="n">xs</span><span class="px">6px</span></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><span class="n">sm</span><span class="px">10px</span></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><span class="n">md</span><span class="px">16px</span></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><span class="n">lg</span><span class="px">24px</span></div>
    <div class="item"><div class="box" style="border-radius:32px"></div><span class="n">xl</span><span class="px">32px</span></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><span class="n">pill</span><span class="px">999px</span></div>
  </div>
</body>
</html>
