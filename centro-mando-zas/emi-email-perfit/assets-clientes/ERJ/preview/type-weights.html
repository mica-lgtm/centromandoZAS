<!-- @dsCard group="Type" viewport="700x150" name="Pesos Montserrat" subtitle="Thin 100 → Black 900, todo el rango disponible" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); color: var(--tinta); padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; }
  .w { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; }
  .lbl { font-size: 10px; font-weight: 600; color: var(--gris-400); width: 78px; flex: none; }
  .sample { font-size: 22px; line-height: 1.1; color: var(--violeta-900); }
</style>
</head>
<body>
  <div class="grid">
    <div class="w"><span class="lbl">Thin 100</span><span class="sample" style="font-weight:100">Rey</span></div>
    <div class="w"><span class="lbl">ExtraLight 200</span><span class="sample" style="font-weight:200">Rey</span></div>
    <div class="w"><span class="lbl">Light 300</span><span class="sample" style="font-weight:300">Rey</span></div>
    <div class="w"><span class="lbl">Regular 400</span><span class="sample" style="font-weight:400">Rey</span></div>
    <div class="w"><span class="lbl">Medium 500</span><span class="sample" style="font-weight:500">Rey</span></div>
    <div class="w"><span class="lbl">SemiBold 600</span><span class="sample" style="font-weight:600">Rey</span></div>
    <div class="w"><span class="lbl">Bold 700</span><span class="sample" style="font-weight:700">Rey</span></div>
    <div class="w"><span class="lbl">ExtraBold 800</span><span class="sample" style="font-weight:800">Rey</span></div>
    <div class="w"><span class="lbl">Black 900</span><span class="sample" style="font-weight:900">Rey</span></div>
  </div>
</body>
</html>
