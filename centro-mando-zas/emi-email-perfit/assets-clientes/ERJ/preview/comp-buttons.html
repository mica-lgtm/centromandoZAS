<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); padding: 22px 24px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .dark { background: var(--violeta-900); padding: 16px; border-radius: 16px; display: inline-flex; gap: 14px; }
</style>
</head>
<body>
  <div class="row">
    <button class="erj-btn erj-btn--primary">Sumate hoy</button>
    <button class="erj-btn erj-btn--violeta">Conocé más</button>
    <button class="erj-btn erj-btn--ghost">Ver horarios</button>
  </div>
  <div class="dark">
    <button class="erj-btn erj-btn--on-dark">Reservá tu lugar</button>
    <button class="erj-btn erj-btn--primary">Quiero ir</button>
  </div>
</body>
</html>
