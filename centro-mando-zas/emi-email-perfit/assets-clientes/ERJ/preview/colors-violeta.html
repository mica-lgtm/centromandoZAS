<!-- @dsCard group="Colors" viewport="700x120" name="Escala Violeta" subtitle="Primario — del violeta profundo a tintes claros" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); }
  .row { display: flex; padding: 18px; gap: 0; }
  .step { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .step:first-child { border-radius: 12px 0 0 12px; }
  .step:last-child { border-radius: 0 12px 12px 0; }
  .k { font-weight: 700; font-size: 11px; }
  .h { font-weight: 500; font-size: 9px; opacity: .8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="step" style="background:#14002f;color:#fff"><span class="k">950</span><span class="h">14002F</span></div>
    <div class="step" style="background:#21014d;color:#fff"><span class="k">900</span><span class="h">21014D</span></div>
    <div class="step" style="background:#2f0a63;color:#fff"><span class="k">800</span><span class="h">2F0A63</span></div>
    <div class="step" style="background:#3f1a7a;color:#fff"><span class="k">700</span><span class="h">3F1A7A</span></div>
    <div class="step" style="background:#533394;color:#fff"><span class="k">600</span><span class="h">533394</span></div>
    <div class="step" style="background:#6b4faf;color:#fff"><span class="k">500</span><span class="h">6B4FAF</span></div>
    <div class="step" style="background:#8b74c4;color:#fff"><span class="k">400</span><span class="h">8B74C4</span></div>
    <div class="step" style="background:#b09ed8;color:#1c0d31"><span class="k">300</span><span class="h">B09ED8</span></div>
    <div class="step" style="background:#d2c6ea;color:#1c0d31"><span class="k">200</span><span class="h">D2C6EA</span></div>
    <div class="step" style="background:#e9e3f4;color:#1c0d31"><span class="k">100</span><span class="h">E9E3F4</span></div>
    <div class="step" style="background:#f5f2fa;color:#1c0d31"><span class="k">50</span><span class="h">F5F2FA</span></div>
  </div>
</body>
</html>
