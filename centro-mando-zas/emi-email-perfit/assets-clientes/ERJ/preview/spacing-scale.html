<!-- @dsCard group="Spacing" viewport="700x130" name="Escala de espaciado" subtitle="Base 4px — del space-1 al space-10" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); padding: 20px 24px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--rosa-500); border-radius: 4px; width: 22px; }
  .n { font-size: 10px; font-weight: 700; color: var(--violeta-900); }
  .px { font-size: 9px; color: var(--gris-400); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="n">1</span><span class="px">4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="n">2</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="n">3</span><span class="px">12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="n">4</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="n">5</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="n">6</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="n">7</span><span class="px">48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="n">8</span><span class="px">64</span></div>
  </div>
</body>
</html>
