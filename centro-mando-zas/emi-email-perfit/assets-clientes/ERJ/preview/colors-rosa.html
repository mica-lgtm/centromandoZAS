<!-- @dsCard group="Colors" viewport="700x120" name="Escala Rosado" subtitle="Acento — CTAs, detalles y palabras destacadas" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); }
  .row { display: flex; padding: 18px; }
  .step { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .step:first-child { border-radius: 12px 0 0 12px; }
  .step:last-child { border-radius: 0 12px 12px 0; }
  .k { font-weight: 700; font-size: 11px; }
  .h { font-weight: 500; font-size: 9px; opacity: .8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="step" style="background:#c5305c;color:#fff"><span class="k">700</span><span class="h">C5305C</span></div>
    <div class="step" style="background:#e1426f;color:#fff"><span class="k">600</span><span class="h">E1426F</span></div>
    <div class="step" style="background:#f35980;color:#fff"><span class="k">500</span><span class="h">F35980</span></div>
    <div class="step" style="background:#f77a99;color:#fff"><span class="k">400</span><span class="h">F77A99</span></div>
    <div class="step" style="background:#fa9db4;color:#1c0d31"><span class="k">300</span><span class="h">FA9DB4</span></div>
    <div class="step" style="background:#fcc4d2;color:#1c0d31"><span class="k">200</span><span class="h">FCC4D2</span></div>
    <div class="step" style="background:#fde4ea;color:#1c0d31"><span class="k">100</span><span class="h">FDE4EA</span></div>
    <div class="step" style="background:#fef3f6;color:#1c0d31"><span class="k">50</span><span class="h">FEF3F6</span></div>
  </div>
</body>
</html>
