<!-- @dsCard group="Type" viewport="700x230" name="Escala tipográfica" subtitle="Montserrat — del display al caption" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--blanco); color: var(--tinta); padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--gris-100); }
  .row:last-child { border-bottom: none; }
  .tag { width: 84px; flex: none; font-size: 11px; font-weight: 600; color: var(--gris-400); font-variant-numeric: tabular-nums; }
  .spec { font-weight: 800; color: var(--violeta-900); letter-spacing: -0.02em; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><span class="tag">display · 78</span><span class="spec" style="font-size:42px">Esperanza</span></div>
  <div class="row"><span class="tag">h1 · 46</span><span class="spec" style="font-size:34px">Tu casa te espera</span></div>
  <div class="row"><span class="tag">h2 · 36</span><span class="spec" style="font-size:27px;font-weight:700">Una comunidad de fe</span></div>
  <div class="row"><span class="tag">lead · 18</span><span class="spec" style="font-size:18px;font-weight:400;color:var(--gris-500)">Vení y encontrá tu lugar este domingo.</span></div>
  <div class="row"><span class="tag">body · 16</span><span class="spec" style="font-size:16px;font-weight:400;color:var(--tinta)">Creemos en una iglesia que transforma vidas.</span></div>
</body>
</html>
