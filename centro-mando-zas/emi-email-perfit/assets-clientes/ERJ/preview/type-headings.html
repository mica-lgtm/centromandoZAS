<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); color: var(--tinta); padding: 22px 24px; }
  .eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--rosa-500); margin-bottom: 10px; }
  .display { font-weight: 900; font-size: 60px; line-height: .98; letter-spacing: -0.02em; margin: 0; }
  .display .em { color: var(--rosa-500); }
  .h2 { font-weight: 700; font-size: 28px; margin: 14px 0 0; letter-spacing: -0.015em; color: var(--violeta-800); }
</style>
</head>
<body>
  <div class="eyebrow">Domingo · 10:30 h</div>
  <h1 class="display">TU CASA TE ESTÁ <span class="em">ESPERANDO</span></h1>
  <div class="h2">Una comunidad donde la fe se vive en familia</div>
</body>
</html>
