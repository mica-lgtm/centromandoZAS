<!-- @dsCard group="Colors" viewport="700x150" name="Degradados de marca" subtitle="Bordó→Violeta · Amanecer · Noche — para piezas emocionales" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); }
  .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 18px; }
  .g { height: 112px; border-radius: 16px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; color: #fff; }
  .n { font-weight: 800; font-size: 13px; }
  .d { font-weight: 600; font-size: 10px; opacity: .8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="g" style="background:var(--grad-bordo-violeta)"><div class="n">Bordó → Violeta</div><div class="d">campañas, headers</div></div>
    <div class="g" style="background:var(--grad-amanecer)"><div class="n">Amanecer</div><div class="d">rosa → bordó → violeta</div></div>
    <div class="g" style="background:var(--grad-rosa-bordo)"><div class="n">Rosa → Bordó</div><div class="d">acentos, botones</div></div>
    <div class="g" style="background:var(--grad-violeta-noche)"><div class="n">Noche</div><div class="d">fondos profundos</div></div>
  </div>
</body>
</html>
