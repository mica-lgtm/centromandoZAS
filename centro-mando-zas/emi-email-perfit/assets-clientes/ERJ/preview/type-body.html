<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--blanco); padding: 22px 24px; max-width: 560px; }
  .eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--rosa-500); }
  .h3 { font-weight: 700; font-size: 22px; color: var(--violeta-900); margin: 8px 0 10px; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--gris-600); }
  .label { display:inline-block; margin-top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gris-400); }
</style>
</head>
<body>
  <div class="eyebrow">Vida en comunidad</div>
  <div class="h3">Encontrá tu lugar en la familia de la fe</div>
  <p>Una iglesia que te acompaña en cada etapa. Sumate a un grupo, serví con tus dones y crecé junto a otros que, como vos, buscan vivir con propósito.</p>
  <span class="label">Domingo · 10:30 h · Presencial y online</span>
</body>
</html>
