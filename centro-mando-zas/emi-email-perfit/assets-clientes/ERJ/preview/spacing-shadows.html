<!-- @dsCard group="Spacing" viewport="700x170" name="Sombras y elevación" subtitle="Sombras teñidas de violeta + glow rosado" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); padding: 26px 24px; }
  .row { display: flex; gap: 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 64px; background: #fff; border-radius: 16px; }
  .n { font-size: 11px; font-weight: 700; color: var(--violeta-900); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="n">sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="n">md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="n">lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="n">xl</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-rosa);background:var(--rosa-500)"></div><span class="n">rosa glow</span></div>
  </div>
</body>
</html>
