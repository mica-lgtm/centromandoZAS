<!-- @dsCard group="Colors" viewport="700x120" name="Escala Bordó" subtitle="Secundario cálido — degradados y acentos" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--crema); }
  .row { display: flex; padding: 18px; }
  .step { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .step:first-child { border-radius: 12px 0 0 12px; }
  .step:last-child { border-radius: 0 12px 12px 0; }
  .k { font-weight: 700; font-size: 11px; }
  .h { font-weight: 500; font-size: 9px; opacity: .8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="step" style="background:#4d0a29;color:#fff"><span class="k">900</span><span class="h">4D0A29</span></div>
    <div class="step" style="background:#5e0e33;color:#fff"><span class="k">800</span><span class="h">5E0E33</span></div>
    <div class="step" style="background:#72113e;color:#fff"><span class="k">700</span><span class="h">72113E</span></div>
    <div class="step" style="background:#8a1a4d;color:#fff"><span class="k">600</span><span class="h">8A1A4D</span></div>
    <div class="step" style="background:#a3275e;color:#fff"><span class="k">500</span><span class="h">A3275E</span></div>
    <div class="step" style="background:#c04576;color:#fff"><span class="k">400</span><span class="h">C04576</span></div>
    <div class="step" style="background:#d97a9c;color:#1c0d31"><span class="k">300</span><span class="h">D97A9C</span></div>
    <div class="step" style="background:#ecb3c7;color:#1c0d31"><span class="k">200</span><span class="h">ECB3C7</span></div>
    <div class="step" style="background:#f6dde6;color:#1c0d31"><span class="k">100</span><span class="h">F6DDE6</span></div>
  </div>
</body>
</html>
