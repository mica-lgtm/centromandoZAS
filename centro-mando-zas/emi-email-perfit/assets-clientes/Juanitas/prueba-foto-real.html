<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<title>Juanitas · Diseño de prueba con foto real</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html,body{margin:0;background:#3a3a42;font-family:var(--font)}
  .stage{display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}
  .frame{box-shadow:0 24px 60px rgba(0,0,0,.35);border-radius:4px;overflow:hidden}

  /* ---------- Placa 1: PROMO 1080x1080 ---------- */
  .promo{position:relative;width:1080px;height:1080px;background:var(--crema);overflow:hidden}
  .promo .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .promo .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,40,47,0) 38%,rgba(40,40,47,.06) 55%,rgba(229,25,127,.92) 100%)}
  .promo .logo{position:absolute;top:64px;left:64px;height:74px;filter:brightness(0) invert(1);opacity:.96}
  .promo .tag{position:absolute;top:72px;right:64px;background:var(--azul);color:#fff;font-weight:800;font-size:30px;
    padding:14px 30px;border-radius:999px;transform:rotate(3deg)}
  .promo .content{position:absolute;left:64px;right:64px;bottom:72px;color:#fff}
  .promo h1{margin:0;font-weight:800;font-size:96px;line-height:.96;letter-spacing:-.02em}
  .promo .hand{font-family:var(--font-hand);font-weight:700;font-size:88px;color:#fff;
    display:block;line-height:.8;margin-bottom:6px;transform:rotate(-4deg);transform-origin:left}
  .promo .sub{margin:18px 0 28px;font-weight:500;font-size:34px;color:rgba(255,255,255,.95);max-width:720px}
  .promo .cta-row{display:flex;align-items:center;gap:22px}
  .promo .cta{background:#fff;color:var(--fucsia);font-weight:800;font-size:32px;
    padding:22px 46px;border-radius:999px}
  .promo .price{display:flex;align-items:baseline;gap:14px}
  .promo .now{font-weight:900;font-size:54px;color:#fff;letter-spacing:-.02em}
  .promo .was{font-weight:600;font-size:30px;color:rgba(255,255,255,.7);text-decoration:line-through}

  .cap{color:#cfcfd6;font-size:13px;text-align:center;margin-top:14px;font-family:var(--font)}
</style></head>
<body>
  <div class="stage">
    <div>
      <div class="frame">
        <div class="promo">
          <img class="photo" src="https://lh3.googleusercontent.com/d/1HFzA98HGeQXClU4st_DSk-QswVd7bnxk=w1400" alt="Bombi tiro alto rayada">
          <div class="grad"></div>
          <img class="logo" src="assets/juanitas-logo.png" alt="juanitas">
          <div class="tag">NUEVO INGRESO</div>
          <div class="content">
            <h1><span class="hand">¡llegó la</span>Tiro alto</h1>
            <p class="sub">La bombi cómoda que no se mueve. Algodón suave, para todos los días.</p>
            <div class="cta-row">
              <span class="cta">La quiero →</span>
              <div class="price"><span class="now">$8.900</span><span class="was">$12.900</span></div>
            </div>
          </div>
        </div>
      </div>
      <p class="cap">PROMO 1080×1080 · foto real de Drive (lh3.googleusercontent.com/d/ID)</p>
    </div>
  </div>
</body></html>
