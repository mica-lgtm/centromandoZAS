<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Juanitas" subtitle="Lettering en crema, bordó y rosa" viewport="700x170" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);margin:0;display:flex}
  .cell{flex:1;height:170px;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .cell img{max-width:78%;max-height:80px;object-fit:contain}
  .crema{background:var(--crema)}
  .bordo{background:var(--bordo)}
  .rosa{background:var(--rosa-claro)}
</style></head>
<body>
  <div class="cell crema"><img src="../assets/juanitas-logo.png" alt="Juanitas"></div>
  <div class="cell bordo"><img src="../assets/juanitas-logo-cream.png" alt="Juanitas"></div>
  <div class="cell rosa"><img src="../assets/juanitas-logo.png" alt="Juanitas"></div>
</body></html>
