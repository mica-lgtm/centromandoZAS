<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Espaciado · 8pt" subtitle="Escala de espaciado" viewport="700x190" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 28px;color:var(--fg1)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--bordo);margin:0 0 16px}
  .row{display:flex;align-items:flex-end;gap:18px}
  .item{text-align:center}
  .box{background:var(--rosa-claro);border:1.5px solid var(--rosa);border-radius:var(--r-md)}
  .cap{font-size:12px;font-weight:600;color:var(--fg2);margin-top:8px}
</style></head>
<body>
  <p class="lead">Espaciado · 8pt</p>
  <div class="row">
    <div class="item"><div class="box" style="width:8px;height:8px"></div><div class="cap">8</div></div>
    <div class="item"><div class="box" style="width:16px;height:16px"></div><div class="cap">16</div></div>
    <div class="item"><div class="box" style="width:24px;height:24px"></div><div class="cap">24</div></div>
    <div class="item"><div class="box" style="width:32px;height:32px"></div><div class="cap">32</div></div>
    <div class="item"><div class="box" style="width:48px;height:48px"></div><div class="cap">48</div></div>
    <div class="item"><div class="box" style="width:64px;height:64px"></div><div class="cap">64</div></div>
    <div class="item"><div class="box" style="width:96px;height:96px"></div><div class="cap">96</div></div>
  </div>
</body></html>
