<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Sombras cálidas" subtitle="Elevación teñida de bordó" viewport="700x200" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box}
  body{font-family:var(--font);background:var(--crema);padding:30px 28px;color:var(--fg1)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--bordo);margin:0 0 22px}
  .row{display:flex;gap:34px}
  .item{text-align:center}
  .box{width:120px;height:80px;background:var(--blanco);border-radius:16px}
  .cap{font-size:12px;font-weight:600;color:var(--fg2);margin-top:14px}
  .sm{box-shadow:var(--sh-sm)}
  .md{box-shadow:var(--sh-md)}
  .lg{box-shadow:var(--sh-lg)}
</style></head>
<body>
  <p class="lead">Sombras cálidas · teñidas de bordó</p>
  <div class="row">
    <div class="item"><div class="box sm"></div><div class="cap">sm · .08</div></div>
    <div class="item"><div class="box md"></div><div class="cap">md · .12</div></div>
    <div class="item"><div class="box lg"></div><div class="cap">lg · .18</div></div>
  </div>
</body></html>
