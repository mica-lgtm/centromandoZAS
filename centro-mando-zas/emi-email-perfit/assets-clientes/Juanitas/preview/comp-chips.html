<!DOCTYPE html>
<!-- @dsCard group="Components" name="Chips & eyebrows" subtitle="Etiquetas de atributo y promo" viewport="700x150" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:var(--blanco);padding:22px 28px;color:var(--fg1)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .chip{font-weight:600;font-size:15px;padding:10px 18px;border-radius:999px}
  .solid{background:var(--coral);color:#fff}
  .pink{background:var(--rosa);color:var(--tinta)}
  .verde{background:var(--verde-soft);color:#2f6b3a}
  .azul{background:var(--azul-soft);color:var(--azul-deep)}
  .amar{background:var(--amarillo-soft);color:#8a6d12}
  .line{background:#fff;color:var(--coral);border:1.5px solid var(--coral)}
</style></head>
<body>
  <p class="lead">Chips &amp; etiquetas</p>
  <div class="row">
    <span class="chip solid">Nuevo ingreso</span>
    <span class="chip pink">Algodón</span>
    <span class="chip verde">Envío gratis</span>
    <span class="chip azul">Talles S–XL</span>
    <span class="chip amar">Edición limitada</span>
    <span class="chip line">Pack x3</span>
  </div>
</body></html>
