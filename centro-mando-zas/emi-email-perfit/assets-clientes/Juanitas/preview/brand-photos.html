<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:#fff;padding:0;color:var(--tinta);display:flex}
  .cell{flex:1;height:230px;overflow:hidden;position:relative}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(40,40,47,.7),transparent);color:#fff;font-size:12px;font-weight:600;padding:18px 12px 8px}
</style></head>
<body>
  <div class="cell"><img src="../assets/productos/colaless-pack-hero.webp" alt=""><span class="cap">Hero recortada (sticker)</span></div>
  <div class="cell"><img src="../assets/productos/colaless-grid-colores.webp" alt=""><span class="cap">Grilla de colores</span></div>
  <div class="cell"><img src="../assets/productos/colaless-grid-basicos.webp" alt=""><span class="cap">Básicos lifestyle</span></div>
</body></html>
