<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutros cálidos" subtitle="Fondos cuando manda el producto" viewport="700x190" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1);box-sizing:border-box}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid var(--linea)}
  .name{font-weight:700;font-size:14px}
  .hex{font-size:12px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 14px}
</style></head>
<body>
  <p class="lead">Neutros cálidos</p>
  <p class="sub">Fondos cuando el producto debe ser protagonista.</p>
  <div class="row">
    <div class="sw" style="background:#FBF6F2"><span class="name">Crema</span><span class="hex">#FBF6F2</span></div>
    <div class="sw" style="background:#F1EAE2"><span class="name">Beige</span><span class="hex">#F1EAE2</span></div>
    <div class="sw" style="background:#E3D7CC"><span class="name">Arena</span><span class="hex">#E3D7CC</span></div>
    <div class="sw" style="background:#FFFFFF"><span class="name">Blanco</span><span class="hex">#FFFFFF</span></div>
  </div>
</body></html>
