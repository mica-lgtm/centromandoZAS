<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Paleta de marca" subtitle="Los 8 colores oficiales" viewport="700x190" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1);box-sizing:border-box}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border-radius:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;box-sizing:border-box}
  .name{font-weight:700;font-size:13px}
  .hex{font-size:11px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="lead">Paleta de marca · 8 colores</p>
  <div class="grid">
    <div class="sw" style="background:#E698AC;color:#28282F"><span class="name">Rosa</span><span class="hex">#E698AC</span></div>
    <div class="sw" style="background:#D85F4A;color:#fff"><span class="name">Coral</span><span class="hex">#D85F4A</span></div>
    <div class="sw" style="background:#E6783F;color:#fff"><span class="name">Naranja</span><span class="hex">#E6783F</span></div>
    <div class="sw" style="background:#E3C759;color:#28282F"><span class="name">Amarillo</span><span class="hex">#E3C759</span></div>
    <div class="sw" style="background:#95CA9E;color:#28282F"><span class="name">Verde</span><span class="hex">#95CA9E</span></div>
    <div class="sw" style="background:#82B9D3;color:#28282F"><span class="name">Celeste</span><span class="hex">#82B9D3</span></div>
    <div class="sw" style="background:#3B6EC5;color:#fff"><span class="name">Azul</span><span class="hex">#3B6EC5</span></div>
    <div class="sw" style="background:#28282F;color:#fff"><span class="name">Tinta</span><span class="hex">#28282F</span></div>
  </div>
</body></html>
