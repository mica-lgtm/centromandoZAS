<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Rosas femeninos" subtitle="Ancla femenina + washes" viewport="700x200" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1)}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 14px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid var(--linea)}
  .name{font-weight:700;font-size:14px}
  .hex{font-size:12px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="lead">Rosa · ancla femenina</p>
  <p class="sub">Identidad y washes femeninos. Fondos suaves para que el producto respire.</p>
  <div class="row">
    <div class="sw" style="background:#E698AC;color:#28282F;border-color:transparent"><span class="name">Rosa</span><span class="hex">#E698AC</span></div>
    <div class="sw" style="background:#FBEAF0;color:#D85F4A"><span class="name">Rosa soft</span><span class="hex">#FBEAF0</span></div>
    <div class="sw" style="background:#FDF4F7;color:#D85F4A"><span class="name">Rosa nube</span><span class="hex">#FDF4F7</span></div>
  </div>
</body></html>
