<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:var(--crema);padding:22px 28px;color:var(--tinta)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 16px;max-width:560px}
  .row{display:flex;gap:30px;align-items:center}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .glyph{font-size:34px;color:var(--fucsia);line-height:1}
  .cap{font-size:11px;font-weight:600;color:var(--fg3)}
  /* línea punteada curva */
  .dash{width:90px;height:40px;border:0;border-top:3px dashed var(--rosa);border-radius:50%;transform:rotate(-12deg)}
  .arrow{font-family:var(--font-hand);font-size:40px;color:var(--coral);font-weight:700}
</style></head>
<body>
  <p class="lead">Motivos / doodles</p>
  <p class="sub">Decoración liviana, dibujada a mano. Siempre sutil, nunca recargar. Color rosa/fucsia/coral.</p>
  <div class="row">
    <div class="item"><span class="glyph">✦</span><span class="cap">sparkle</span></div>
    <div class="item"><span class="glyph">✧</span><span class="cap">sparkle 2</span></div>
    <div class="item"><span class="glyph" style="color:var(--rosa)">♥</span><span class="cap">corazón</span></div>
    <div class="item"><span class="glyph" style="font-size:28px">❀</span><span class="cap">florcita</span></div>
    <div class="item"><span class="dash"></span><span class="cap">línea punteada</span></div>
    <div class="item"><span class="arrow">↝</span><span class="cap">flecha mano</span></div>
    <div class="item"><span class="glyph" style="color:var(--amarillo)">✿</span><span class="cap">mariposa/flor</span></div>
  </div>
</body></html>
