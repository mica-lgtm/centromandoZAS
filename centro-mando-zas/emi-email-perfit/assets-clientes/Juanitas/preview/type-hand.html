<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:var(--crema);padding:24px 28px;color:var(--tinta)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 10px}
  .demo{display:flex;align-items:center;gap:28px}
  .big{line-height:.86}
  .big .hand{font-family:var(--font-hand);font-weight:600;font-size:64px;color:var(--fucsia);display:block;margin-bottom:-6px}
  .big .caps{font-weight:800;font-size:52px;letter-spacing:-.01em}
  .note{font-family:var(--font-hand);font-weight:600;font-size:30px;color:var(--coral)}
  .sub{font-size:13px;color:var(--fg2);max-width:230px;margin:0}
</style></head>
<body>
  <p class="lead">Lettering manuscrito</p>
  <div class="demo">
    <div class="big"><span class="hand">colaless</span><span class="caps">TIRO ALTO</span></div>
    <div class="note">Mili usa talle 7 ↘</div>
    <p class="sub">Caveat (sustituto) para palabras de acento y anotaciones. Siempre sobre Poppins bold.</p>
  </div>
</body></html>
