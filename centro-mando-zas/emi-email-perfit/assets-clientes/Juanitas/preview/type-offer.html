<!DOCTYPE html>
<!-- @dsCard group="Type" name="Número de oferta" subtitle="El % como elemento gráfico gigante" viewport="700x200" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box}
  body{font-family:var(--font);background:var(--rosa-claro);padding:24px 28px;color:var(--fg1);display:flex;align-items:center;gap:28px}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--bordo);margin:0 0 6px}
  .sub{font-size:14px;color:var(--fg2);max-width:240px;margin:0}
  .offer{display:flex;align-items:flex-start;line-height:.82}
  .num{font-weight:900;font-size:128px;color:var(--rojo);letter-spacing:-.04em}
  .pct{font-weight:900;font-size:54px;color:var(--rojo);margin-top:10px}
  .off{font-weight:800;font-size:30px;color:var(--bordo);align-self:flex-end;margin:0 0 16px 6px}
</style></head>
<body>
  <div>
    <p class="lead">Número de oferta</p>
    <p class="sub">El % manda. Poppins Black, gigante, en rojo comercial. Es un elemento gráfico, no texto.</p>
  </div>
  <div class="offer">
    <span class="num">50</span><span class="pct">%</span><span class="off">OFF</span>
  </div>
</body></html>
