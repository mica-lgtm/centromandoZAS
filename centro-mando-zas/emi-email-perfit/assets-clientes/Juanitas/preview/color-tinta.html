<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Tinta · texto" subtitle="Negro cálido vinoso, no gris frío" viewport="700x190" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1);box-sizing:border-box}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;border:1px solid var(--linea)}
  .name{font-weight:700;font-size:13px}
  .hex{font-size:12px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 14px}
</style></head>
<body>
  <p class="lead">Tinta · Texto</p>
  <p class="sub">Negro neutro suave — base de todo el texto.</p>
  <div class="row">
    <div class="sw" style="background:#28282F;color:#fff;border-color:transparent"><span class="name">fg1 · principal</span><span class="hex">#28282F</span></div>
    <div class="sw" style="background:#5B5B63;color:#fff;border-color:transparent"><span class="name">fg2 · secundario</span><span class="hex">#5B5B63</span></div>
    <div class="sw" style="background:#9A9AA3;color:#fff;border-color:transparent"><span class="name">fg3 · terciario</span><span class="hex">#9A9AA3</span></div>
    <div class="sw" style="background:#ECE6E0;color:#28282F"><span class="name">línea · borde</span><span class="hex">#ECE6E0</span></div>
  </div>
</body></html>
