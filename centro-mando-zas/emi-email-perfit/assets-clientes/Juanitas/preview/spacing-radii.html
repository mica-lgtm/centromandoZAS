<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radios" subtitle="sm → pill" viewport="700x170" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 28px;color:var(--fg1)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--bordo);margin:0 0 16px}
  .row{display:flex;align-items:center;gap:20px}
  .item{text-align:center}
  .box{width:84px;height:64px;background:var(--bordo)}
  .cap{font-size:12px;font-weight:600;color:var(--fg2);margin-top:8px}
</style></head>
<body>
  <p class="lead">Radios</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="cap">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="cap">md · 16</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="cap">lg · 28</div></div>
    <div class="item"><div class="box" style="border-radius:40px"></div><div class="cap">xl · 40</div></div>
    <div class="item"><div class="box" style="width:120px;border-radius:999px"></div><div class="cap">pill · 999</div></div>
  </div>
</body></html>
