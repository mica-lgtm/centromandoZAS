<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Acción & oferta" subtitle="Coral CTA + naranja" viewport="700x200" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1);box-sizing:border-box}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 14px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .name{font-weight:700;font-size:14px}
  .hex{font-size:12px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="lead">Acción &amp; oferta</p>
  <p class="sub">Coral es el color de CTA, % OFF y urgencia. Naranja acompaña como destacado cálido.</p>
  <div class="row">
    <div class="sw" style="background:#D85F4A;color:#fff"><span class="name">Coral · acción</span><span class="hex">#D85F4A</span></div>
    <div class="sw" style="background:#BE4631;color:#fff"><span class="name">Coral deep · hover</span><span class="hex">#BE4631</span></div>
    <div class="sw" style="background:#E6783F;color:#fff"><span class="name">Naranja</span><span class="hex">#E6783F</span></div>
    <div class="sw" style="background:#FBE7E1;color:#BE4631"><span class="name">Coral soft · fondo</span><span class="hex">#FBE7E1</span></div>
  </div>
</body></html>
