<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Acentos frescos" subtitle="Azul, celeste, verde, amarillo" viewport="700x200" --><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font);background:var(--blanco);padding:22px 24px;color:var(--fg1);box-sizing:border-box}
  .lead{font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 14px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:14px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .name{font-weight:700;font-size:14px}
  .hex{font-size:12px;font-weight:500;opacity:.9;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="lead">Acentos frescos</p>
  <p class="sub">Para variedad, codificar categorías/temporadas y dar aire. Cada uno con su versión suave de fondo.</p>
  <div class="row">
    <div class="sw" style="background:#3B6EC5;color:#fff"><span class="name">Azul</span><span class="hex">#3B6EC5</span></div>
    <div class="sw" style="background:#82B9D3;color:#28282F"><span class="name">Celeste</span><span class="hex">#82B9D3</span></div>
    <div class="sw" style="background:#95CA9E;color:#28282F"><span class="name">Verde</span><span class="hex">#95CA9E</span></div>
    <div class="sw" style="background:#E3C759;color:#28282F"><span class="name">Amarillo</span><span class="hex">#E3C759</span></div>
  </div>
</body></html>
