<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{min-height:100vh;box-sizing:border-box;font-family:var(--font);background:var(--crema);padding:24px 28px;color:var(--tinta)}
  .lead{font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin:0 0 6px}
  .sub{font-size:13px;color:var(--fg2);margin:0 0 18px;max-width:560px}
  .lines{font-weight:800;font-size:34px;line-height:1.5}
  .swatches{display:flex;gap:8px;margin-top:18px}
  .sq{width:34px;height:34px;border-radius:6px}
</style></head>
<body>
  <p class="lead">Resaltador · recurso estrella</p>
  <p class="sub">Bloque de color sólido detrás de la palabra clave, como un fibrón. Codifica info por color.</p>
  <div class="lines">
    <span class="mark mark-fucsia">3X2</span> en bombis &nbsp;
    <span class="mark mark-azul">ENVÍO GRATIS</span><br>
    <span class="mark mark-coral">50% OFF</span> &nbsp;
    <span class="mark mark-amarillo">NUEVO</span>
  </div>
  <div class="swatches">
    <div class="sq mark-fucsia"></div><div class="sq mark-coral"></div>
    <div class="sq mark-naranja"></div><div class="sq mark-amarillo"></div>
    <div class="sq mark-azul"></div><div class="sq mark-rosa"></div>
    <div class="sq mark-tinta"></div>
  </div>
</body></html>
