<!DOCTYPE html>
<!-- @dsCard group="Type" name="Tipografía — Display / Statement" subtitle="Elms Sans Black, titulares de impacto" viewport="700x240" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 24px 28px; }
  .spec { color: var(--fg1); }
  .d1 { font-size: 60px; font-weight: 900; line-height: 0.92; letter-spacing: -0.03em; }
  .d2 { font-size: 38px; font-weight: 800; line-height: 0.98; letter-spacing: -0.02em; margin-top: 10px; color: var(--fg2);}
  .meta { margin-top: 14px; font-size: 11px; color: var(--fg3); font-weight: 500; letter-spacing: 0.02em; }
  .meta b { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="spec">
    <div class="d1">No hace falta<br>cambiar todo.</div>
    <div class="d2">La diferencia es comprar mejor.</div>
  </div>
  <div class="meta"><b>Display</b> · Elms Sans Black 900 · 96/68px · line-height 0.94–0.98 · tracking −0.03/−0.02em · titulares tipo statement</div>
</div>
</body>
</html>
