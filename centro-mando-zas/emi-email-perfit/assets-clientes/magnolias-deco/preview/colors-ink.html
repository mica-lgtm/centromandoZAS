<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Tinta y contraste" subtitle="Negro, carbón, muted, blanco" viewport="700x165" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 78px; }
  .meta { padding: 8px 10px 10px; background: #fff; }
  .name { font-weight: 700; font-size: 13px; color: var(--fg1); letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--fg3); font-weight: 500; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
  .role { font-size: 10.5px; color: var(--fg3); margin-top: 4px; line-height: 1.3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#0A0A0A;"></div>
      <div class="meta"><div class="name">Negro principal</div><div class="hex">#0A0A0A</div><div class="role">Títulos grandes</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#1F1F1F;"></div>
      <div class="meta"><div class="name">Carbón</div><div class="hex">#1F1F1F</div><div class="role">Textos secundarios</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#5A544C;"></div>
      <div class="meta"><div class="name">Muted</div><div class="hex">#5A544C</div><div class="role">Captions sobre fondo claro</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#FFFFFF;border:1px solid var(--border);box-sizing:border-box;"></div>
      <div class="meta"><div class="name">Blanco puro</div><div class="hex">#FFFFFF</div><div class="role">Bloques de alto contraste</div></div>
    </div>
  </div>
</div>
</body>
</html>
