<!DOCTYPE html>
<!-- @dsCard group="Components" name="Card de producto" subtitle="Foto + categoría + precio + CTA" viewport="700x400" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 20px 24px; display: flex; gap: 18px; }
  .card { width: 220px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .ph { position: relative; aspect-ratio: 1/1; background: #eee; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 10px; left: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
  .info { padding: 12px 14px 14px; }
  .cat { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg3); }
  .name { font-size: 16px; font-weight: 700; color: var(--fg1); letter-spacing: -0.01em; margin-top: 3px; line-height: 1.15; }
  .price { margin-top: 10px; display: flex; align-items: baseline; gap: 8px; }
  .now { font-weight: 900; font-size: 20px; color: var(--red); letter-spacing: -0.02em; }
  .was { font-size: 13px; color: var(--fg3); text-decoration: line-through; }
  .cta { margin-top: 12px; width: 100%; border: none; background: var(--black); color: #fff; font-family: var(--font-sans); font-weight: 700; font-size: 13px; padding: 11px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="ph"><span class="badge">-30%</span><img src="../assets/img-coffee-table.webp" alt=""></div>
    <div class="info">
      <div class="cat">Muebles</div>
      <div class="name">Mesa ratona Nórdica</div>
      <div class="price"><span class="now">$62.300</span><span class="was">$89.000</span></div>
      <button class="cta">Comprá ahora</button>
    </div>
  </div>
  <div class="card">
    <div class="ph"><span class="badge" style="background:var(--yellow);color:#0A0A0A;">Nuevo</span><img src="../assets/img-detail-3.webp" alt=""></div>
    <div class="info">
      <div class="cat">Textiles</div>
      <div class="name">Cortina lino Bruma</div>
      <div class="price"><span class="now">$34.900</span></div>
      <button class="cta">Comprá ahora</button>
    </div>
  </div>
</div>
</body>
</html>
