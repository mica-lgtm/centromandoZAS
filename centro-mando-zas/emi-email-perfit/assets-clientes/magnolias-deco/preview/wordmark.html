<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Wordmark / isotipo" subtitle="Logotipo tipográfico (sustituto — sin logo oficial)" viewport="700x180" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); display: flex; }
  .wrap { padding: 0; display: flex; width: 100%; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; }
  .word { font-weight: 900; font-size: 30px; letter-spacing: -0.03em; line-height: 0.9; text-align: center; }
  .sub { font-size: 10px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; }
  .mono { font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel" style="background:#F8F3EA;">
    <div class="word" style="color:#0A0A0A;">Magnolias<span style="color:#B32626;">.</span></div>
    <div class="sub" style="color:#B98A5F;">Deco · Hogar</div>
  </div>
  <div class="panel" style="background:#0A0A0A;">
    <div class="word" style="color:#fff;">Magnolias<span style="color:#FFCC00;">.</span></div>
    <div class="sub" style="color:#BEB7AE;">Deco · Hogar</div>
  </div>
  <div class="panel" style="background:#B32626;">
    <div class="word mono" style="color:#fff;">M.</div>
    <div class="sub" style="color:#F5E7E4;">Isotipo</div>
  </div>
</div>
</body>
</html>
