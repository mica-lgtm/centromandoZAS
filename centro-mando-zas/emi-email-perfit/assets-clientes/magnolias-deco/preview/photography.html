<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Estilo fotográfico" subtitle="Luz natural cálida, neutros, producto protagonista" viewport="700x290" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 16px 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ph { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { margin-top: 10px; font-size: 10.5px; color: var(--fg3); font-weight: 500; line-height: 1.4; }
  .cap b { color: var(--fg2); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="ph"><img src="../assets/img-living-room.webp" alt=""></div>
    <div class="ph"><img src="../assets/img-nightstand.webp" alt=""></div>
    <div class="ph"><img src="../assets/img-table-setting.webp" alt=""></div>
    <div class="ph"><img src="../assets/img-outdoor-chair.webp" alt=""></div>
  </div>
  <div class="cap"><b>Estilo fotográfico:</b> luz natural, cálida y luminosa · paleta neutra (madera, fibras, lino, cerámica, plantas) · ambiente despejado · producto protagonista · nunca inventar ni deformar productos.</div>
</div>
</body>
</html>
