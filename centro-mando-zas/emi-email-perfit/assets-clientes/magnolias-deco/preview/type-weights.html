<!DOCTYPE html>
<!-- @dsCard group="Type" name="Elms Sans — Pesos" subtitle="ExtraLight 200 → Black 900 + itálicas" viewport="700x180" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 18px 26px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 18px; }
  .w { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
  .sample { font-size: 26px; color: var(--fg1); line-height: 1; }
  .tag { font-size: 10px; color: var(--fg3); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="w"><span class="sample" style="font-weight:200;">Aa</span><span class="tag">ExtraLight 200</span></div>
    <div class="w"><span class="sample" style="font-weight:300;">Aa</span><span class="tag">Light 300</span></div>
    <div class="w"><span class="sample" style="font-weight:400;">Aa</span><span class="tag">Regular 400</span></div>
    <div class="w"><span class="sample" style="font-weight:400;font-style:italic;">Aa</span><span class="tag">Italic 400</span></div>
    <div class="w"><span class="sample" style="font-weight:500;">Aa</span><span class="tag">Medium 500</span></div>
    <div class="w"><span class="sample" style="font-weight:600;">Aa</span><span class="tag">SemiBold 600</span></div>
    <div class="w"><span class="sample" style="font-weight:700;">Aa</span><span class="tag">Bold 700</span></div>
    <div class="w"><span class="sample" style="font-weight:800;">Aa</span><span class="tag">ExtraBold 800</span></div>
    <div class="w"><span class="sample" style="font-weight:900;">Aa</span><span class="tag">Black 900</span></div>
    <div class="w"><span class="sample" style="font-weight:900;font-style:italic;">Aa</span><span class="tag">Black Italic</span></div>
  </div>
</div>
</body>
</html>
