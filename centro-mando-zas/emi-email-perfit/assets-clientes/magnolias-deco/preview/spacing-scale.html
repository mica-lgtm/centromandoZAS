<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Escala de espaciado" subtitle="Base 4px · tokens 1–9" viewport="700x170" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 20px 26px; display: flex; align-items: flex-end; gap: 14px; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 30px; background: var(--wood); border-radius: 3px; }
  .px { font-size: 10px; color: var(--fg3); font-weight: 600; }
  .tok { font-size: 10px; color: var(--fg2); font-weight: 700; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="unit"><div class="bar" style="height:4px;"></div><div class="px">4</div><div class="tok">1</div></div>
  <div class="unit"><div class="bar" style="height:8px;"></div><div class="px">8</div><div class="tok">2</div></div>
  <div class="unit"><div class="bar" style="height:12px;"></div><div class="px">12</div><div class="tok">3</div></div>
  <div class="unit"><div class="bar" style="height:16px;"></div><div class="px">16</div><div class="tok">4</div></div>
  <div class="unit"><div class="bar" style="height:24px;"></div><div class="px">24</div><div class="tok">5</div></div>
  <div class="unit"><div class="bar" style="height:32px;"></div><div class="px">32</div><div class="tok">6</div></div>
  <div class="unit"><div class="bar" style="height:48px;"></div><div class="px">48</div><div class="tok">7</div></div>
  <div class="unit"><div class="bar" style="height:64px;"></div><div class="px">64</div><div class="tok">8</div></div>
  <div class="unit"><div class="bar" style="height:96px;"></div><div class="px">96</div><div class="tok">9</div></div>
</div>
</body>
</html>
