<!DOCTYPE html>
<!-- @dsCard group="Components" name="Etiquetas comerciales" subtitle="Oferta, nuevo, descuento, precio" viewport="700x150" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 24px 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .tag-pill { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; }
  .disc { font-weight: 900; font-size: 22px; color: #fff; background: var(--red); padding: 10px 14px; border-radius: 8px; letter-spacing: -0.02em; line-height: 1; }
  .price { display: inline-flex; align-items: baseline; gap: 8px; }
  .now { font-weight: 900; font-size: 30px; color: var(--red); letter-spacing: -0.03em; }
  .was { font-size: 16px; color: var(--fg3); text-decoration: line-through; font-weight: 500; }
  .lbl { width: 100%; font-size: 10px; font-weight: 700; color: var(--fg3); letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <span class="lbl">Etiquetas comerciales · precios</span>
  <span class="tag-pill" style="background:var(--red);color:#fff;">Oferta</span>
  <span class="tag-pill" style="background:var(--yellow);color:#0A0A0A;">Nuevo</span>
  <span class="tag-pill" style="background:var(--black);color:#fff;">Envío gratis</span>
  <span class="tag-pill" style="background:#fff;color:#0A0A0A;border:1.5px solid var(--border-strong);">3 cuotas</span>
  <span class="disc">-30%</span>
  <span class="price"><span class="was">$48.900</span><span class="now">$34.230</span></span>
</div>
</body>
</html>
