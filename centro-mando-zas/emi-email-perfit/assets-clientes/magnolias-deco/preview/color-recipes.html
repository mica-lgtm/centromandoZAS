<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Recetas de color" subtitle="5 combinaciones permitidas — nunca mezclar todo" viewport="700x180" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .recipe { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .vis { height: 96px; position: relative; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .vis .t { font-weight: 900; font-size: 16px; line-height: 0.95; letter-spacing: -0.02em; text-align: center; }
  .dot { width: 16px; height: 16px; border-radius: 4px; position: absolute; bottom: 8px; right: 8px; }
  .cap { background: #fff; padding: 7px 9px; font-size: 10.5px; font-weight: 600; color: var(--fg2); line-height: 1.25; }
  .num { color: var(--red); font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="recipe">
      <div class="vis" style="background:#F8F3EA;"><span class="t" style="color:#0A0A0A;">Texto<br>negro</span><span class="dot" style="background:#B32626;"></span></div>
      <div class="cap"><span class="num">1.</span> Neutro + negro + acento rojo</div>
    </div>
    <div class="recipe">
      <div class="vis" style="background:#B98A5F;"><span class="t" style="background:#fff;color:#0A0A0A;padding:6px 10px;border-radius:4px;">Bloque</span></div>
      <div class="cap"><span class="num">2.</span> Foto + bloques blancos + texto negro</div>
    </div>
    <div class="recipe">
      <div class="vis" style="background:#FFCC00;"><span class="t" style="background:#fff;color:#0A0A0A;padding:6px 10px;border-radius:4px;">Frase</span></div>
      <div class="cap"><span class="num">3.</span> Amarillo + bloques blancos + negro</div>
    </div>
    <div class="recipe">
      <div class="vis" style="background:#F8F3EA;"><span class="t" style="color:#0A0A0A;">Producto</span><span class="dot" style="background:#B32626;width:38px;height:18px;border-radius:4px;"></span></div>
      <div class="cap"><span class="num">4.</span> Claro + producto + CTA rojo</div>
    </div>
    <div class="recipe">
      <div class="vis" style="background:#1F1F1F;"><span class="t" style="color:#fff;">Texto<br>blanco</span><span class="dot" style="background:#FFCC00;"></span></div>
      <div class="cap"><span class="num">5.</span> Oscuro/foto + blanco + acento</div>
    </div>
  </div>
</div>
</body>
</html>
