<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radios de esquina" subtitle="sm → xl + pill (solo tags)" viewport="700x150" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 22px 26px; display: flex; gap: 18px; }
  .unit { text-align: center; }
  .box { width: 88px; height: 64px; background: var(--white); border: 1.5px solid var(--wood); }
  .nm { font-size: 11px; font-weight: 700; color: var(--fg1); margin-top: 8px; }
  .vl { font-size: 10px; color: var(--fg3); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <div class="unit"><div class="box" style="border-radius:4px;"></div><div class="nm">sm</div><div class="vl">4px · chips</div></div>
  <div class="unit"><div class="box" style="border-radius:8px;"></div><div class="nm">md</div><div class="vl">8px · cards</div></div>
  <div class="unit"><div class="box" style="border-radius:16px;"></div><div class="nm">lg</div><div class="vl">16px · fotos</div></div>
  <div class="unit"><div class="box" style="border-radius:24px;"></div><div class="nm">xl</div><div class="vl">24px · hero</div></div>
  <div class="unit"><div class="box" style="border-radius:999px;"></div><div class="nm">pill</div><div class="vl">solo tags</div></div>
</div>
</body>
</html>
