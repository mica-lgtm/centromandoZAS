<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Base neutra cálida" subtitle="Off-white, beige, arena, madera, gris" viewport="700x165" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--offwhite); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 78px; }
  .meta { padding: 8px 10px 10px; background: #fff; }
  .name { font-weight: 700; font-size: 13px; color: var(--fg1); letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--fg3); font-weight: 500; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
  .role { font-size: 10.5px; color: var(--fg3); margin-top: 4px; line-height: 1.3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:#F8F3EA;border-bottom:1px solid var(--border);"></div>
      <div class="meta"><div class="name">Off-white cálido</div><div class="hex">#F8F3EA</div><div class="role">Fondo por defecto</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#E9D8C3;"></div>
      <div class="meta"><div class="name">Beige claro</div><div class="hex">#E9D8C3</div><div class="role">Sección alterna cálida</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#D8BFA3;"></div>
      <div class="meta"><div class="name">Arena</div><div class="hex">#D8BFA3</div><div class="role">Bloques neutros suaves</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#B98A5F;"></div>
      <div class="meta"><div class="name">Tostado / madera</div><div class="hex">#B98A5F</div><div class="role">Acento natural cálido</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#BEB7AE;"></div>
      <div class="meta"><div class="name">Gris cálido</div><div class="hex">#BEB7AE</div><div class="role">Neutro de soporte</div></div>
    </div>
  </div>
</div>
</body>
</html>
